name: Feature request
description: An idea for something Nota should do, or do better.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the music-making situation, not the solution yet — it helps find the best fix.
      placeholder: I record vocals in several takes and want to pick the best parts of each without cutting clips by hand.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help?
      description: How you imagine it working. Mentioning how another DAW does it is welcome.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Which part of Nota is this about? Pick more than one if it spans several. The answer sets the issue's `area:` label.
      multiple: true
      options:
        - Arrangement
        - Session view
        - Mixer and routing
        - Modular
        - Piano roll and clip editor
        - Automation
        - Built-in instruments and effects
        - Plug-ins (VST3 / AU)
        - Recording and inputs
        - Transport and tempo
        - Browser and samples
        - MIDI controllers and gamepads
        - Keyboard shortcuts
        - Nota Remote
        - MCP server
        - Assistant and AI
        - Projects and import/export
        - Audio engine and performance
        - Interface and windows
        - Preferences and Downloads
        - Install and build
        - Not sure
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: >-
        Sketches, screenshots, links. Accepted ideas get a short specification in
        specs/ before implementation begins.
  - type: checkboxes
    id: contribute
    attributes:
      label: Want to build it yourself?
      description: >-
        Please wait until a core contributor adds the `approved` label before you
        start — pull requests without an approved issue are closed unreviewed.
      options:
        - label: I'd like to implement this once it is approved
